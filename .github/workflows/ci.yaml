name: CI

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      # Step da aula 2, não está no arquivo do professor
      - name: Start server
        run: |
          node src/app.js &
          npx wait-on http://localhost:3000/

      - name: Run Jest
        run: npm test

  delivery:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ success() }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESSS_TOKEN }}
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Fetch all branches
        run: git fetch --all

      - name: Checkout and merge
        run: |
          git checkout main
          git merge origin/develop --allow-unrelated-histories --no-edit
          git push origin main